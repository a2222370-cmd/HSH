</script></head><body><main><h1>本機電腦資訊偵測</h1><p id="status" role="status">正在偵測這台裝置…</p><dl><dt>作業系統</dt><dd id="os">偵測中…</dd><dt>瀏覽器</dt><dd id="browser">偵測中…</dd><dt>公網 IP</dt><dd id="publicIp">偵測中…</dd><dt>內網 IP</dt><dd id="localIp">偵測中…</dd></dl><button id="retry" type="button">重新偵測</button><p>瀏覽器未提供的資訊會明確標示；不會填入其他電腦的 IP。</p></main><script>
