<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電腦挑人抽籤系統</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --accent: #f59e0b;
    --bg: #f1f5f9;
    --card-bg: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #cbd5e1;
    --empty-bg: #f8fafc;
    --filled-bg: #eff6ff;
    --excluded-bg: #e2e8f0;
    --success: #16a34a;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
    --shadow-md: 0 8px 24px rgba(15,23,42,0.10), 0 2px 6px rgba(15,23,42,0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background-color: var(--bg);
    background-image: linear-gradient(135deg, #ddd6fe 0%, #bfdbfe 45%, #fbcfe8 100%);
    background-attachment: fixed;
    color: var(--text);
    padding: 24px 16px 60px;
    min-height: 100vh;
    position: relative;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    width: 440px;
    height: 440px;
    border-radius: 50%;
    filter: blur(70px);
    z-index: -1;
    opacity: 0.5;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  body::before {
    background: radial-gradient(circle, #8b5cf6, transparent 70%);
    top: -140px;
    left: -120px;
  }
  body::after {
    background: radial-gradient(circle, #ec4899, transparent 70%);
    bottom: -160px;
    right: -110px;
  }
  body.darkmode::before, body.darkmode::after { opacity: 0.22; }
  body.bigscreen::before, body.bigscreen::after { display: none; }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    position: relative;
  }
  h1 {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    margin: 4px 0 8px;
    letter-spacing: -0.02em;
    color: var(--primary-dark);
    background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .panel {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    padding: 22px 24px;
    margin-bottom: 20px;
    border: 1px solid rgba(148,163,184,0.16);
    animation: fadeInUp 0.55s cubic-bezier(.22,.9,.32,1) both;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .setup-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
  }
  .field input {
    width: 100px;
    padding: 9px 10px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    text-align: center;
  }
  .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
  .field select {
    padding: 9px 10px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    padding: 10px 20px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease, opacity 0.15s ease, background 0.2s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  button:active:not(:disabled) { transform: translateY(0) scale(0.97); }
  button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  #btnSetup { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
  #btnExclude { background: linear-gradient(135deg, #64748b, #475569); color: #fff; }
  #btnDraw {
    background: linear-gradient(135deg, var(--accent), #d97706);
    color: #fff;
    font-size: 18px;
    padding: 14px 32px;
    box-shadow: 0 4px 14px rgba(245,158,11,0.35);
  }
  @keyframes drawPulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(245,158,11,0.35); }
    50% { box-shadow: 0 4px 22px rgba(245,158,11,0.6); }
  }
  #btnDraw:not(:disabled) { animation: drawPulse 2.2s ease-in-out infinite; }
  #btnUndo { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #b91c1c; }
  #btnReset { background: linear-gradient(135deg, #e2e8f0, #cbd5e1); color: var(--text); }
  .tool-btn { background: linear-gradient(135deg, #eef2ff, #e0e7ff); color: #3730a3; font-size: 13.5px; padding: 8px 14px; }

  .result-panel {
    text-align: center;
  }
  .result-box {
    min-height: 78px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .result-number {
    font-size: 44px;
    font-weight: 800;
    color: #fff;
    line-height: 1;
    display: inline-block;
    padding: 14px 30px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: var(--shadow-md);
  }
  .result-pos {
    font-size: 16px;
    color: var(--muted);
    font-weight: 600;
  }
  .result-placeholder {
    font-size: 16px;
    color: var(--muted);
  }
  .progress {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }
  .done-msg {
    font-size: 15px;
    color: #fff;
    font-weight: 700;
    margin-top: 10px;
    display: inline-block;
    padding: 8px 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--success), #15803d);
    box-shadow: var(--shadow-sm);
  }

  .action-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .tools-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .grid-wrap {
    overflow-x: auto;
  }
  .grid {
    display: grid;
    gap: 8px;
    justify-content: center;
    margin: 0 auto;
  }
  .cell {
    aspect-ratio: 1 / 1;
    min-width: 46px;
    background: var(--empty-bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    position: relative;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cell.filled {
    background: var(--filled-bg);
    border-color: var(--primary);
    color: var(--primary-dark);
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), var(--shadow-sm);
  }
  .cell.filled:hover {
    outline: 2px solid var(--primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .cell.excluded {
    background: var(--excluded-bg);
    border-style: dashed;
    color: #94a3b8;
    font-size: 15px;
  }
  .cell.just-filled {
    animation: pop 0.45s cubic-bezier(.34,1.56,.64,1);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245,158,11,0.35);
  }
  @keyframes pop {
    0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    55% { transform: scale(1.15) rotate(3deg); }
    80% { transform: scale(0.95) rotate(-1deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .cell .coord {
    position: absolute;
    bottom: 3px;
    right: 3px;
    font-size: 8px;
    font-weight: 700;
    color: var(--muted);
    background: rgba(255,255,255,0.65);
    padding: 1px 4px;
    border-radius: 6px;
    line-height: 1.4;
  }
  body.darkmode .cell .coord { background: rgba(0,0,0,0.32); }
  .grid.exclude-editing .cell:not(.filled) { cursor: pointer; }
  .grid.exclude-editing .cell:not(.filled):hover { outline: 2px solid var(--accent); }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
  }
  .exclude-hint {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
  }
  /* 線上人數（與圖面／標準文件查詢系統同樣的呈現方式） */
  .online-wrap { text-align: center; margin: -12px 0 18px; }
  .online-badge {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    font-size: 12.5px; font-weight: 700; color: #166534;
    background: rgba(220,252,231,0.9); border: 1px solid #86efac; border-radius: 999px; padding: 3px 12px;
  }
  .online-badge:hover { background: #dcfce7; }
  .online-badge .arrow { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  .online-badge.off { color: var(--muted); background: rgba(241,245,249,0.9); border-color: var(--border); }
  .online-badge.off .dot-pulse { background: #94a3b8; animation: none; }
  .dot-pulse { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; animation: pulseDot 2s infinite; }
  @keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.7); } 70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .online-list {
    max-width: 760px; margin: 10px auto 0; padding: 10px 14px; text-align: left; font-size: 12.5px;
    background: var(--card-bg); border: 1.5px solid #bfdbfe; border-radius: 10px; box-shadow: var(--shadow-sm);
    max-height: 240px; overflow: auto;
  }
  .online-list table { width: 100%; min-width: 520px; border-collapse: collapse; }
  .online-list th, .online-list td { padding: 5px 6px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  .online-list th { color: var(--muted); font-weight: 600; }
  .online-list .mono { font-family: Consolas, ui-monospace, monospace; }
  .online-list tr.me td { color: var(--success); font-weight: 700; }
  .online-list .ol-note { color: var(--muted); margin-top: 6px; font-size: 11.5px; }
  body.darkmode .online-badge { background: rgba(20,83,45,0.55); border-color: #166534; color: #86efac; }
  body.darkmode .online-badge.off { background: rgba(30,41,59,0.8); border-color: var(--border); color: var(--muted); }
  body.darkmode .online-list { border-color: #1e3a8a; }
  /* 雲端同步設定：管理者鎖 */
  .cloud-lock-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 12px; font-size: 13px; font-weight: 600;
  }
  .cloud-lock-bar.unlocked { background: #dcfce7; border-color: #86efac; color: #166534; }
  body.darkmode .cloud-lock-bar { background: rgba(120,53,15,0.35); border-color: #92400e; color: #fcd34d; }
  body.darkmode .cloud-lock-bar.unlocked { background: rgba(20,83,45,0.45); border-color: #166534; color: #86efac; }
  #cloudPanel input:disabled { opacity: 0.6; cursor: not-allowed; }
  .cloud-status-error {
    color: #dc2626 !important;
    font-weight: 700;
  }
  .history-panel {
    margin-top: 16px;
    border-top: 1px dashed var(--border);
    padding-top: 14px;
    text-align: left;
  }
  .history-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 8px;
    text-align: center;
  }
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 12px;
    background: var(--empty-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .group-result-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 12px;
    background: var(--empty-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .group-swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex: none;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.6);
    align-self: center;
  }
  body.darkmode .group-swatch { box-shadow: 0 0 0 2px rgba(0,0,0,0.35); }
  .group-result-label {
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    min-width: 84px;
  }
  .group-result-nums {
    color: var(--muted);
    font-weight: 600;
    word-break: break-all;
  }
  .history-item .h-seq {
    color: var(--muted);
    font-size: 12px;
    min-width: 60px;
  }
  .history-item .h-num {
    font-weight: 800;
    color: var(--primary-dark);
    font-size: 17px;
  }
  .history-item .h-pos {
    color: var(--muted);
    font-size: 13px;
  }
  .history-empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 8px 0;
  }
  .changelog-entry {
    padding: 10px 12px;
    border-bottom: 1px dashed var(--border);
  }
  .changelog-entry:last-child { border-bottom: none; }
  .changelog-head {
    font-weight: 800;
    color: var(--primary-dark);
    font-size: 14px;
    margin-bottom: 4px;
  }
  .changelog-date {
    color: var(--muted);
    font-weight: 400;
    font-size: 12px;
    margin-left: 6px;
  }
  .changelog-entry ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
    color: var(--text);
  }
  .changelog-entry li { margin-bottom: 2px; }
  .print-only { display: none; }

  body.bigscreen #setupPanel,
  body.bigscreen #toolsPanel,
  body.bigscreen #changelogPanel,
  body.bigscreen #cloudPanel,
  body.bigscreen #groupResultPanel,
  body.bigscreen .history-panel,
  body.bigscreen .hint { display: none !important; }
  body.bigscreen .online-wrap { display: none !important; }
  body.bigscreen h1 { font-size: 42px; }
  body.bigscreen .result-number { font-size: 96px; }
  body.bigscreen .result-pos { font-size: 30px; }
  body.bigscreen .progress { font-size: 18px; }
  body.bigscreen .cell { font-size: 30px; }
  body.bigscreen #btnDraw { font-size: 28px; padding: 20px 48px; }
  .exit-bigscreen-btn {
    display: none;
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 999;
    background: rgba(15,23,42,0.6);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    box-shadow: var(--shadow-sm);
  }
  body.bigscreen .exit-bigscreen-btn { display: inline-block !important; }

  body.darkmode {
    --primary: #3b82f6;
    --primary-dark: #60a5fa;
    --accent: #fbbf24;
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
    --empty-bg: #1e293b;
    --filled-bg: #1e3a8a;
    --excluded-bg: #334155;
    --success: #4ade80;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
    background-color: var(--bg);
    background-image: linear-gradient(160deg, #1e1b4b 0%, #0f172a 55%, #4a044e 100%);
    color: var(--text);
  }
  body.darkmode .cell.excluded { color: #64748b; }
  body.darkmode .cell.filled { box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), var(--shadow-sm); }
  body.darkmode .panel {
    background: rgba(30,41,59,0.72);
    border-color: rgba(148,163,184,0.1);
  }

  @media print {
    body, .print-only { background: #fff !important; color: #000 !important; }
    body::before, body::after { display: none !important; content: none !important; }
    .exit-bigscreen-btn { display: none !important; }
    h1, #setupPanel, #toolsPanel, .result-panel, #cloudPanel, #groupResultPanel, #changelogPanel,
    .history-panel, .hint, .online-wrap { display: none !important; }
    #gridPanel { background: #fff !important; box-shadow: none !important; border: none !important; padding: 0 !important; }
    .cell { box-shadow: none !important; }
    #printTitle { display: block; text-align: center; font-size: 22px; font-weight: 800; margin-bottom: 16px; }
    #printGroupResults { display: block; margin-top: 22px; padding-top: 14px; border-top: 2px solid #333; }
    #printGroupResults:empty { display: none !important; border: none !important; margin: 0 !important; padding: 0 !important; }
    #printGroupResults .print-group-title { text-align: center; font-size: 16px; font-weight: 800; margin-bottom: 10px; }
    #printGroupResults .print-group-row { font-size: 13px; padding: 5px 0; border-bottom: 1px dashed #ccc; }
    #printGroupResults .print-group-row b { display: inline-block; min-width: 80px; }
  }

  @media (max-width: 480px) {
    .result-number { font-size: 34px; }
    .cell { min-width: 36px; font-size: 15px; }
  }
</style>
</head>
<body>
<button class="exit-bigscreen-btn" id="btnExitBigScreenFloat" onclick="toggleBigScreen()" title="退出大螢幕模式（也可以按 Esc）">↩️ 退出大螢幕</button>
<div class="print-only" id="printTitle"></div>
<div class="wrap">
  <h1>🎲 電腦挑人抽籤系統</h1>
  <div class="hint" style="text-align:center; margin-top:0; margin-bottom:20px;">版本 <span id="versionTag"></span>（<a href="#" onclick="toggleChangelog(); return false;" style="color:var(--primary); text-decoration:none;">查看改版內容</a>）</div>
  <div class="online-wrap">
    <span class="online-badge off" id="onlineBadge" onclick="toggleOnlineList()" title="點擊查看目前在線的電腦">
      <span class="dot-pulse"></span><span>線上：<b id="onlineCount">—</b> 人</span><span class="arrow" id="onlineArrow">▾</span>
    </span>
    <div class="online-list" id="onlineList" style="display:none;"></div>
  </div>

  <div class="panel" id="toolsPanel">
    <div class="tools-row">
      <button class="tool-btn" id="btnSound" onclick="toggleSound()">🔈 音效開</button>
      <button class="tool-btn" id="btnBigScreen" onclick="toggleBigScreen()">🖥 大螢幕模式</button>
      <button class="tool-btn" id="btnFullscreen" onclick="toggleFullscreen()">⛶ 全螢幕</button>
      <button class="tool-btn" id="btnDarkMode" onclick="toggleDarkMode()">🌙 深色模式</button>
      <button class="tool-btn" onclick="printSeatChart()">🖨 列印/匯出座位表</button>
      <button class="tool-btn" onclick="exportGridAsPng()">🖼 匯出座位圖片(PNG)</button>
      <button class="tool-btn" onclick="exportHistoryCsv()">📤 匯出紀錄 CSV</button>
      <button class="tool-btn" id="btnCloud" onclick="toggleCloudPanel()">☁️ 雲端同步設定</button>
      <button class="tool-btn" id="btnGroupResult" onclick="toggleGroupResultPanel()">📊 分組結果</button>
      <button class="tool-btn" id="btnChangelog" onclick="toggleChangelog()">📋 版本紀錄</button>
    </div>
  </div>

  <div class="panel" id="setupPanel">
    <div class="setup-row">
      <div class="field">
        <label for="seatModeSelect">座位稱呼</label>
        <select id="seatModeSelect" onchange="onSeatModeChange(); saveStateToStorage();">
          <option value="grid">行列（例如：第 3 行 第 5 列）</option>
          <option value="table">桌人（例如：第 3 桌 第 5 位）</option>
        </select>
      </div>
      <div class="field">
        <label for="rowsInput" id="rowsLabel">行數</label>
        <input type="number" id="rowsInput" min="1" max="30" value="5">
      </div>
      <div class="field">
        <label for="colsInput" id="colsLabel">列數</label>
        <input type="number" id="colsInput" min="1" max="30" value="6">
      </div>
      <div class="field">
        <label for="drawLimitInput">限制抽出人數</label>
        <input type="number" id="drawLimitInput" min="1" placeholder="留白＝全部抽完" style="width:120px;" oninput="updateTotalHint(); saveStateToStorage();">
      </div>
      <button id="btnSetup" onclick="setupGrid()">建立格子</button>
      <button id="btnExclude" onclick="toggleExcludeMode()" disabled>🚫 設定排除格</button>
      <div class="field">
        <label for="groupMode">分組上色</label>
        <select id="groupMode" onchange="applyGroupColors(); saveStateToStorage();">

  // ============ 建立 / 重設格子 ============
  function setupGrid() {
    var r = parseInt(document.getElementById('rowsInput').value, 10);
    var c = parseInt(document.getElementById('colsInput').value, 10);
    var u = unitNames_();

    if (!r || !c || r < 1 || c < 1) {
      alert('請輸入大於 0 的' + u.rowLabel + '與' + u.colLabel + '！');
      return;
    }
    if (r * c > 900) {
      alert('格子總數過多（超過 900 格），請縮小' + u.rowLabel + '或' + u.colLabel + '。');
      return;
    }

    rows = r; cols = c; total = r * c;
    filledCount = 0;
    pool = [];
    cellOrder = [];
    for (var i = 0; i < total; i++) cellOrder.push(i);
    activeCellOrder = [];
    drawHistory = [];
    drawnMap = {};
    excluded = {};
    excludeMode = false;
    started = false;
    CLOUD_SESSION_ID = null;
    randomGroupMaps = {};

    renderEmptyGrid();
    updateTotalHint();
    updateProgress();
    renderHistory();
    renderGroupResults();

    document.getElementById('btnDraw').disabled = false;
    document.getElementById('btnDrawAll').disabled = false;
    document.getElementById('btnUndo').disabled = true;
    document.getElementById('btnReset').disabled = false;
    document.getElementById('btnHistory').disabled = false;
    document.getElementById('btnExclude').disabled = false;
    document.getElementById('btnExclude').textContent = '🚫 設定排除格';
    document.getElementById('excludeHint').textContent = '';
    document.getElementById('grid').classList.remove('exclude-editing');
    document.getElementById('resultPlaceholder').style.display = '';
    document.getElementById('resultPlaceholder').textContent = '請按「抽籤」開始';
    document.getElementById('resultBox').querySelectorAll('.result-number, .result-pos, .done-msg').forEach(function(el){ el.remove(); });

    saveStateToStorage();
  }

  function renderEmptyGrid() {
    var grid = document.getElementById('grid');
    var emptyState = document.getElementById('emptyState');
    emptyState.style.display = 'none';
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    grid.innerHTML = '';
    cellRefs = [];

    for (var idx = 0; idx < total; idx++) {
      var r = Math.floor(idx / cols) + 1;
      var c = (idx % cols) + 1;
      var cellEl = document.createElement('div');
      cellEl.className = 'cell';
      cellEl.innerHTML = '<span class="coord">' + r + '-' + c + '</span>';
      cellEl.onclick = makeCellClickHandler(idx);
      grid.appendChild(cellEl);
      cellRefs.push(cellEl);
    }
    reapplyExcludedVisuals();
  }

  function makeCellClickHandler(idx) {
    return function() { onCellClick(idx); };
  }

  // ============ 座位稱呼：行列 / 桌人（抽籤順序行為一樣；「依位置分組」在桌人模式下改為亂數分組，見 groupIndexForCell） ============
  function unitNames_() {
    return seatMode === 'table'
      ? { row: '桌', col: '位', rowLabel: '桌數', colLabel: '每桌人數' }
      : { row: '行', col: '列', rowLabel: '行數', colLabel: '列數' };
  }
  function posLabel_(r, c) {
    return seatMode === 'table' ? ('第 ' + r + ' 桌　第 ' + c + ' 位') : ('左邊數來第 ' + r + ' 行　第 ' + c + ' 列');
  }
  function applySeatModeLabels_() {
    var u = unitNames_();
    var rowsLabelEl = document.getElementById('rowsLabel');
    var colsLabelEl = document.getElementById('colsLabel');
    if (rowsLabelEl) rowsLabelEl.textContent = u.rowLabel;
    if (colsLabelEl) colsLabelEl.textContent = u.colLabel;
    var byRowOpt = document.querySelector('#groupMode option[value="byRow"]');
    var byColOpt = document.querySelector('#groupMode option[value="byCol"]');
    if (byRowOpt) byRowOpt.textContent = seatMode === 'table' ? '隨機分組（每組人數同每桌人數）' : '依「行」分組';
    if (byColOpt) byColOpt.textContent = seatMode === 'table' ? '隨機分組（分組數同每桌人數）' : '依「列」分組';
  }
  function onSeatModeChange() {
    var sel = document.getElementById('seatModeSelect');
    seatMode = sel ? sel.value : 'grid';
    applySeatModeLabels_();
    updateTotalHint();
    renderGroupResults();
  }

  function getDrawLimit_() {
    var input = document.getElementById('drawLimitInput');
    var v = input ? parseInt(input.value, 10) : NaN;
    return (v && v > 0) ? v : null;
  }
  function updateTotalHint() {
    var excludedCount = Object.keys(excluded).length;
    var activeN = total - excludedCount;
    var text = seatMode === 'table'
      ? ('共 ' + rows + ' 桌，每桌 ' + cols + ' 人 ＝ ' + total + ' 人')
      : ('共 ' + rows + ' 行 × ' + cols + ' 列 ＝ ' + total + ' 格');
    if (excludedCount > 0) text += '（排除 ' + excludedCount + ' 個，實際參與抽籤 ' + activeN + ' 個）';
    var limit = getDrawLimit_();
    if (limit && limit < activeN) text += '　→　這次只抽 ' + limit + ' 位';
    document.getElementById('totalHint').textContent = text;
  }

  function updateProgress() {
    var denom = started ? activeCellOrder.length : (total - Object.keys(excluded).length);
    document.getElementById('progressText').textContent =
      total ? ('已抽出 ' + filledCount + ' / ' + denom + ' 格') : '';
  }

  // ============ 排除格編輯 ============
  function toggleExcludeMode() {
    if (started || total === 0) return;
    excludeMode = !excludeMode;
    document.getElementById('grid').classList.toggle('exclude-editing', excludeMode);
    document.getElementById('btnExclude').textContent = excludeMode ? '✅ 完成排除設定' : '🚫 設定排除格';
    document.getElementById('excludeHint').textContent = excludeMode ? '點擊格子切換是否排除（虛線灰底＝排除）' : '';
  }

  function onCellClick(idx) {
    // 已經抽出號碼的格子：點一下可以重新顯示是第幾行第幾列，不受排除格編輯模式影響
    if (drawnMap[idx]) {
      var info = drawnMap[idx];
      showResult(info.num, info.r, info.c);
      return;
    }
    if (!excludeMode || started) return;
    if (excluded[idx]) { delete excluded[idx]; } else { excluded[idx] = true; }
    renderCellExcludeState(idx);
    updateTotalHint();
    updateProgress();
    saveStateToStorage();
  }

  function renderCellExcludeState(idx) {
    var cellEl = cellRefs[idx];
    if (!cellEl) return;
    var r = Math.floor(idx / cols) + 1, c = (idx % cols) + 1;
    if (excluded[idx]) {
      cellEl.classList.add('excluded');
      cellEl.innerHTML = '🚫<span class="coord">' + r + '-' + c + '</span>';
    } else {
      cellEl.classList.remove('excluded');
      cellEl.innerHTML = '<span class="coord">' + r + '-' + c + '</span>';
    }
  }

  function reapplyExcludedVisuals() {
    Object.keys(excluded).forEach(function(k) { renderCellExcludeState(parseInt(k, 10)); });
  }

  function lockExcludeEditing() {
    excludeMode = false;
    var grid = document.getElementById('grid');
    if (grid) grid.classList.remove('exclude-editing');
    var btn = document.getElementById('btnExclude');
    btn.disabled = true;
    btn.textContent = '🚫 設定排除格';
    document.getElementById('excludeHint').textContent = '';
  }

  // ============ 抽籤（含洗牌動畫與音效） ============
  function shuffleArray_(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  // 座位（格子）被抽出的先後順序：不管「座位稱呼」選行列還是桌人，
  // 行為都一樣＝整個打散、隨機揭曉，不會照順序從第一格開始
  // 若有設定「限制抽出人數」，打散後只保留前 N 個
  function buildActiveCellOrder_() {
    var order = cellOrder.filter(function(i) { return !excluded[i]; });
    shuffleArray_(order);
    var limit = getDrawLimit_();
    if (limit && limit > 0 && limit < order.length) {
      order = order.slice(0, limit);
    }
    return order;
  }
  function drawNumber() {
    if (!started) {
      activeCellOrder = buildActiveCellOrder_();
      if (activeCellOrder.length === 0) { alert('所有格子都被設定為排除，沒有格子可以抽籤！'); return; }
      pool = [];
      for (var i = 1; i <= activeCellOrder.length; i++) pool.push(i);
      started = true;
      lockExcludeEditing();
      updateProgress();
      cloudCreateSession_();
    }
    if (pool.length === 0 || filledCount >= activeCellOrder.length) return;

    var btn = document.getElementById('btnDraw');
    btn.disabled = true;

    var cellIdx = activeCellOrder[filledCount];
    var cellEl = cellRefs[cellIdx];
    var r = Math.floor(cellIdx / cols) + 1, c = (cellIdx % cols) + 1;

    // 洗牌效果：格子先快速跳動亂數約 500ms 增加臨場感，再定案真正抽出的號碼
    cellEl.classList.add('filled');
    var rollTimer = setInterval(function() {
      var fake = pool[Math.floor(Math.random() * pool.length)];
      cellEl.innerHTML = fake;
      if (soundOn) playTick();
    }, 60);

    setTimeout(function() {
      clearInterval(rollTimer);
      finalizeDraw(cellIdx, r, c, cellEl);
    }, 520);
  }

  function finalizeDraw(cellIdx, r, c, cellEl) {
    var randIdx = Math.floor(Math.random() * pool.length);
    var drawn = pool[randIdx];
    pool.splice(randIdx, 1);

    cellEl.innerHTML = drawn + '<span class="coord">' + r + '-' + c + '</span>';
    cellEl.classList.add('filled', 'just-filled');
    setTimeout(function() { cellEl.classList.remove('just-filled'); }, 400);

    filledCount++;
    updateProgress();
    showResult(drawn, r, c);
    if (soundOn) playReveal();

    drawHistory.push({ seq: filledCount, num: drawn, r: r, c: c, cellIdx: cellIdx });
    drawnMap[cellIdx] = { num: drawn, r: r, c: c };
    applyGroupColorToCell(cellIdx);
    renderGroupResults();
    if (historyVisible) renderHistory();
    document.getElementById('btnUndo').disabled = false;
    cloudAddDraw_(filledCount, drawn, r, c);

    if (filledCount >= activeCellOrder.length) {
      document.getElementById('btnDraw').disabled = true;
      document.getElementById('btnDrawAll').disabled = true;
      if (soundOn) playDoneChime();
      var done = document.createElement('div');
      done.className = 'done-msg';
      done.textContent = '🎉 已抽完全部 ' + activeCellOrder.length + ' 格！';
      document.getElementById('resultBox').appendChild(done);
      cloudCompleteSession_();
    } else {
      document.getElementById('btnDraw').disabled = false;
    }

    saveStateToStorage();
  }

  // ============ 一鍵直接產生全部抽獎結果（不用一個一個手動抽） ============
  function drawAllInstant() {
    if (!started) {
      activeCellOrder = buildActiveCellOrder_();
      if (activeCellOrder.length === 0) { alert('所有格子都被設定為排除，沒有格子可以抽籤！'); return; }
      pool = [];
      for (var i = 1; i <= activeCellOrder.length; i++) pool.push(i);
      started = true;
      lockExcludeEditing();
      cloudCreateSession_();
    }
    if (pool.length === 0 || filledCount >= activeCellOrder.length) { alert('已經抽完了，沒有剩下的格子可以產生結果。'); return; }

    var remaining = activeCellOrder.length - filledCount;
    if (filledCount > 0 && !confirm('目前已經手動抽出 ' + filledCount + ' 格，要直接把剩下 ' + remaining + ' 格的結果一次產生出來嗎？')) return;
    if (filledCount === 0 && !confirm('確定要一次產生全部 ' + remaining + ' 格的抽籤結果嗎？（就不會有一個一個抽的過程）')) return;

    document.getElementById('btnDraw').disabled = true;
    document.getElementById('btnDrawAll').disabled = true;

    while (pool.length > 0 && filledCount < activeCellOrder.length) {
      var cellIdx = activeCellOrder[filledCount];
      var cellEl = cellRefs[cellIdx];
      var r = Math.floor(cellIdx / cols) + 1, c = (cellIdx % cols) + 1;
      var randIdx = Math.floor(Math.random() * pool.length);
      var drawn = pool[randIdx];
      pool.splice(randIdx, 1);

      cellEl.innerHTML = drawn + '<span class="coord">' + r + '-' + c + '</span>';
      cellEl.classList.add('filled', 'just-filled');
      (function(el) { setTimeout(function() { el.classList.remove('just-filled'); }, 500); })(cellEl);

      filledCount++;
      drawHistory.push({ seq: filledCount, num: drawn, r: r, c: c, cellIdx: cellIdx });
      drawnMap[cellIdx] = { num: drawn, r: r, c: c };
      applyGroupColorToCell(cellIdx);
      cloudAddDraw_(filledCount, drawn, r, c);
    }

    updateProgress();
    renderGroupResults();
    if (historyVisible) renderHistory();
    document.getElementById('btnUndo').disabled = drawHistory.length === 0;

    var last = drawHistory[drawHistory.length - 1];
    if (last) showResult(last.num, last.r, last.c);
    if (soundOn) playDoneChime();

    var done = document.createElement('div');
    done.className = 'done-msg';
    done.textContent = '⚡ 已一鍵產生全部 ' + activeCellOrder.length + ' 格的結果！';
    document.getElementById('resultBox').appendChild(done);
    cloudCompleteSession_();

    saveStateToStorage();
  }

  function showResult(num, r, c) {
    var box = document.getElementById('resultBox');
    var placeholder = document.getElementById('resultPlaceholder');
    if (placeholder) placeholder.style.display = 'none';

    var numEl = box.querySelector('.result-number');
    var posEl = box.querySelector('.result-pos');
    if (!numEl) {
      numEl = document.createElement('div');
      numEl.className = 'result-number';
      box.insertBefore(numEl, box.firstChild);
    }
    if (!posEl) {
      posEl = document.createElement('div');
      posEl.className = 'result-pos';
      box.insertBefore(posEl, numEl.nextSibling);
    }
    numEl.textContent = num;
    posEl.textContent = posLabel_(r, c);
  }

  function clearResultDisplay() {
    var box = document.getElementById('resultBox');
    box.querySelectorAll('.result-number, .result-pos, .done-msg').forEach(function(el){ el.remove(); });
    var ph = document.getElementById('resultPlaceholder');
    if (ph) { ph.style.display = ''; ph.textContent = started ? '請按「抽籤」繼續' : '請按「抽籤」開始'; }
  }

  // ============ 復原上一步 ============
  function undoLastDraw() {
    if (drawHistory.length === 0) { alert('目前沒有可以復原的抽籤紀錄'); return; }
    var last = drawHistory.pop();
    pool.push(last.num);
    filledCount--;
    delete drawnMap[last.cellIdx];

    var cellEl = cellRefs[last.cellIdx];
    var r = Math.floor(last.cellIdx / cols) + 1, c = (last.cellIdx % cols) + 1;
    cellEl.classList.remove('filled', 'just-filled');
    cellEl.innerHTML = '<span class="coord">' + r + '-' + c + '</span>';
    cellEl.style.backgroundColor = '';
    cellEl.style.borderColor = '';
    cellEl.style.color = '';
    cellEl.style.fontWeight = '';

    updateProgress();
    renderGroupResults();
    if (historyVisible) renderHistory();
    document.getElementById('btnUndo').disabled = drawHistory.length === 0;
    document.getElementById('btnDraw').disabled = false;
    document.getElementById('btnDrawAll').disabled = false;

    var done = document.getElementById('resultBox').querySelector('.done-msg');
    if (done) done.remove();

    if (drawHistory.length > 0) {
      var prev = drawHistory[drawHistory.length - 1];
      showResult(prev.num, prev.r, prev.c);
    } else {
      clearResultDisplay();
    }

    cloudUndoLastDraw_();
    saveStateToStorage();
  }

  // ============ 重新開始 ============
  function resetGrid() {
    if (total > 0 && !confirm('確定要清空目前的格子重新抽籤嗎？（排除格設定會保留）')) return;
    filledCount = 0;
    pool = [];
    activeCellOrder = [];
    drawHistory = [];
    drawnMap = {};
    started = false;
    excludeMode = false;
    CLOUD_SESSION_ID = null;
    randomGroupMaps = {};

    renderEmptyGrid();
    updateTotalHint();
    updateProgress();
    renderHistory();
    renderGroupResults();

    document.getElementById('btnDraw').disabled = false;
    document.getElementById('btnDrawAll').disabled = false;
    document.getElementById('btnUndo').disabled = true;
    document.getElementById('btnExclude').disabled = false;
    document.getElementById('btnExclude').textContent = '🚫 設定排除格';
    document.getElementById('excludeHint').textContent = '';
    clearResultDisplay();

    saveStateToStorage();
  }

  // ============ 最近三次結果 ============
  function toggleHistory() {
    historyVisible = !historyVisible;
    var panel = document.getElementById('historyPanel');
    panel.style.display = historyVisible ? '' : 'none';
    if (historyVisible) renderHistory();
  }

  function renderHistory() {
    var listEl = document.getElementById('historyList');
    if (!listEl) return;
    var recent = drawHistory.slice(-3).reverse();
    if (recent.length === 0) {
      listEl.innerHTML = '<div class="history-empty">尚無抽籤紀錄</div>';
      return;
    }
    listEl.innerHTML = recent.map(function(h) {
      return '<div class="history-item">' +
        '<span class="h-seq">第 ' + h.seq + ' 次</span>' +
        '<span class="h-num">' + h.num + '</span>' +
        '<span class="h-pos">' + posLabel_(h.r, h.c) + '</span>' +
        '</div>';
    }).join('');
  }

  // ============ 音效（Web Audio，不需外部音檔） ============
  var audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    return audioCtx;
  }
  function beep(freq, duration, type) {
    var ctx = getAudioCtx();
    if (!ctx) return;
    try {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }
  function playTick() { beep(440, 0.05, 'square'); }
  function playReveal() { beep(880, 0.18, 'sine'); }
  function playDoneChime() {
    beep(660, 0.15);
    setTimeout(function(){ beep(880, 0.15); }, 150);
    setTimeout(function(){ beep(1100, 0.25); }, 300);
  }
  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById('btnSound').textContent = soundOn ? '🔈 音效開' : '🔇 音效關';
  }

  // ============ 大螢幕模式 ============
  function toggleBigScreen() {
    bigScreen = !bigScreen;
    document.body.classList.toggle('bigscreen', bigScreen);
    document.getElementById('btnBigScreen').textContent = bigScreen ? '↩️ 退出大螢幕' : '🖥 大螢幕模式';
  }

  // ============ 全螢幕模式（Fullscreen API） ============
  function toggleFullscreen() {
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) { try { req.call(el); } catch (e) {} }
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (exit) { try { exit.call(document); } catch (e) {} }
    }
  }
  function updateFullscreenBtn() {
    var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    var btn = document.getElementById('btnFullscreen');
    if (btn) btn.textContent = isFs ? '↩️ 退出全螢幕' : '⛶ 全螢幕';
  }
  document.addEventListener('fullscreenchange', updateFullscreenBtn);
  document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

  // ============ 深色模式 ============
  function toggleDarkMode() {
    darkMode = !darkMode;
    document.body.classList.toggle('darkmode', darkMode);
    document.getElementById('btnDarkMode').textContent = darkMode ? '☀️ 淺色模式' : '🌙 深色模式';
    try { localStorage.setItem(DARKMODE_KEY, darkMode ? '1' : '0'); } catch (e) {}
    applyGroupColors(); // 分組顏色淺色/深色各自有一套色盤，切換深色模式要重新套色
  }
  function loadDarkModePref() {
    var v;
    try { v = localStorage.getItem(DARKMODE_KEY); } catch (e) { return; }
    if (v === '1') {
      darkMode = true;
      document.body.classList.add('darkmode');
      document.getElementById('btnDarkMode').textContent = '☀️ 淺色模式';
    }
  }

  // ============ 分組上色 ============
  function hexToRgba(hex, alpha) {
    var v = hex.replace('#', '');
    var r = parseInt(v.substring(0, 2), 16), g = parseInt(v.substring(2, 4), 16), b = parseInt(v.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  function currentGroupPalette_() { return darkMode ? GROUP_COLORS_DARK : GROUP_COLORS_LIGHT; }

  // 亂數分組：把 1~poolSize 隨機打散，每 groupSize 個一組，回傳「真正的組別編號」（不做顏色 mod，避免組數超過顏色數時把不同組誤判成同一組）
  // 注意：poolSize 要用「這次真正會抽出的人數」（activeCellOrder.length，已經排除「排除格」跟「限制抽出人數」），
  // 不能用格子總數 total——因為抽到的號碼（num）本來就只會落在 1~activeCellOrder.length 之間，
  // 如果拿 total 來打散分組，號碼會對不上，變成組數過多、每組人數卻湊不滿（例如限制抽 100 人、分 5 個一組，
  // 結果沒有變成 20 組 5 人，而是打散進遠超過 20 組、每組卻只有 1~2 人）
  // 同一場次（同樣的 poolSize）固定不變，重新整理網頁也會沿用
  function getRandomGroupMap_(mode, groupSize) {
    var poolSize = (activeCellOrder && activeCellOrder.length) ? activeCellOrder.length : total;
    var cache = randomGroupMaps[mode];
    if (cache && cache.poolSize === poolSize) return cache.map;
    var nums = [];
    for (var i = 1; i <= poolSize; i++) nums.push(i);
    for (var i = nums.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = nums[i]; nums[i] = nums[j]; nums[j] = tmp;
    }
    var map = {};
    for (var i = 0; i < nums.length; i++) {
      map[nums[i]] = Math.floor(i / groupSize);
    }
    randomGroupMaps[mode] = { poolSize: poolSize, map: map };
    return map;
  }
  // 回傳「真正的組別編號」（0-based，未做顏色 mod）；組別編號才是分組結果清單要用的依據
  function groupIndexForCell(idx, num) {
    var sel = document.getElementById('groupMode');
    var mode = sel ? sel.value : 'none';
    if (mode === 'none') return null;
    var r = Math.floor(idx / cols), c = idx % cols;
    if (mode === 'parity') return num % 2;
    // 依「行/桌」分組、依「列/桌內座位」分組：行列模式維持原本依座位位置分組；
    // 桌人模式改成「亂數分組」，但組數／每組人數跟原本依位置分組時一樣
    // （依桌分組 → 每組人數＝每桌人數；依桌內座位分組 → 分組數＝每桌人數）
    if (mode === 'byRow') {
      if (seatMode === 'table') return getRandomGroupMap_('byRow_table', cols)[num];
      return r;
    }
    if (mode === 'byCol') {
      if (seatMode === 'table') return getRandomGroupMap_('byCol_table', rows)[num];
      return c;
    }
    if (mode === 'rand2') return getRandomGroupMap_('rand2', 2)[num];
    if (mode === 'rand3') return getRandomGroupMap_('rand3', 3)[num];
    if (mode === 'rand5') return getRandomGroupMap_('rand5', 5)[num];
    if (mode === 'rand10') return getRandomGroupMap_('rand10', 10)[num];
    if (mode === 'rand20') return getRandomGroupMap_('rand20', 20)[num];
    return null;
  }
  function colorForGroupIndex_(gi) {
    var palette = currentGroupPalette_();
    var i = ((gi % palette.length) + palette.length) % palette.length;
    return palette[i];
  }
  function groupColorForCell(idx, num) {
    var gi = groupIndexForCell(idx, num);
    if (gi === null) return null;
    return colorForGroupIndex_(gi);
  }
  function applyGroupColorToCell(idx) {
    var info = drawnMap[idx];
    var cellEl = cellRefs[idx];
    if (!info || !cellEl) return;
    var color = groupColorForCell(idx, info.num);
    if (color) {
      cellEl.style.backgroundColor = hexToRgba(color, 0.22);
      cellEl.style.borderColor = color;
      cellEl.style.color = color;
      cellEl.style.fontWeight = '800';
    } else {
      cellEl.style.backgroundColor = '';
      cellEl.style.borderColor = '';
      cellEl.style.color = '';
      cellEl.style.fontWeight = '';
    }
  }
  function applyGroupColors() {
    Object.keys(drawnMap).forEach(function(k) { applyGroupColorToCell(parseInt(k, 10)); });
    renderGroupResults();
  }

  // ============ 結果清單（有分組就依組別；沒分組就依「抽到的順序」列出） ============
  function collectGroupResults_() {
    var groups = {};
    Object.keys(drawnMap).forEach(function(k) {
      var idx = parseInt(k, 10);
      var info = drawnMap[idx];
      var gi = groupIndexForCell(idx, info.num);
      if (gi === null) return;
      if (!groups[gi]) groups[gi] = [];
      groups[gi].push(info.num);
    });
    var giList = Object.keys(groups).map(Number).sort(function(a, b) { return a - b; });
    return giList.map(function(gi) {
      return { gi: gi, color: colorForGroupIndex_(gi), nums: groups[gi].sort(function(a, b) { return a - b; }) };
    });
  }
  // 決定「結果清單」要用哪種方式排列：有開「分組上色」就依組別；沒開的話，改成依「抽到的先後順序」列出
  function getResultBreakdown_() {
    var sel = document.getElementById('groupMode');
    var mode = sel ? sel.value : 'none';
    if (mode !== 'none') return { type: 'group', items: collectGroupResults_() };
    return { type: 'sequence', items: drawHistory.slice() };
  }
  function renderGroupResults() {
    var box = document.getElementById('groupResultList');
    if (!box) return;
    var b = getResultBreakdown_();
    if (b.items.length === 0) {
      box.innerHTML = '<div class="empty-state">還沒有抽出任何號碼，抽籤過程中這裡會即時列出結果。</div>';
      return;
    }
    if (b.type === 'group') {
      box.innerHTML = b.items.map(function(g) {
        return '<div class="group-result-row">' +
          '<span class="group-swatch" style="background:' + g.color + ';"></span>' +
          '<span class="group-result-label">第 ' + (g.gi + 1) + ' 組（' + g.nums.length + ' 人）</span>' +
          '<span class="group-result-nums">' + g.nums.join('、') + '</span>' +
          '</div>';
      }).join('');
    } else {
      box.innerHTML = b.items.map(function(h) {
        return '<div class="group-result-row">' +
          '<span class="group-result-label">第 ' + h.seq + ' 個抽到</span>' +
          '<span class="group-result-nums">' + h.num + '　→　' + posLabel_(h.r, h.c) + '</span>' +
          '</div>';
      }).join('');
    }
  }
  function toggleGroupResultPanel() {
    var panel = document.getElementById('groupResultPanel');
    var show = panel.style.display === 'none';
    panel.style.display = show ? '' : 'none';
    if (show) renderGroupResults();
  }

  // ============ 雲端同步（Google 試算表 / GAS API） ============
  function loadCloudSettings() {
    try {
      CLOUD_API_URL = localStorage.getItem(CLOUD_URL_KEY) || '';
      CLOUD_API_TOKEN = localStorage.getItem(CLOUD_TOKEN_KEY) || '';
    } catch (e) {}
    var urlInput = document.getElementById('cloudUrlInput');
    var tokenInput = document.getElementById('cloudTokenInput');
    if (urlInput) urlInput.value = CLOUD_API_URL;
    if (tokenInput) tokenInput.value = CLOUD_API_TOKEN;
    updateCloudStatus();
  }

  // 儲存設定：只有管理者解鎖後才能存；有填網址的話，會先到「新網址」的後端驗證管理者密碼，通過才存
  function saveCloudSettings() {
    if (!CLOUD_ADMIN_UNLOCKED) { alert('只有管理者可以修改雲端同步設定，請先按「🔑 管理者解鎖」。'); return; }
    var url = (document.getElementById('cloudUrlInput').value || '').trim();
    var token = (document.getElementById('cloudTokenInput').value || '').trim();
    var doSave = function() {
      CLOUD_API_URL = url;
      CLOUD_API_TOKEN = token;
      try {
        localStorage.setItem(CLOUD_URL_KEY, CLOUD_API_URL);
        localStorage.setItem(CLOUD_TOKEN_KEY, CLOUD_API_TOKEN);
      } catch (e) {}
      updateCloudStatus();
      pingPresence();
      cloudAdminTouch_();
      alert('雲端同步設定已儲存！下次「建立格子」後開始抽籤，就會自動建立雲端場次並同步。');
    };
    if (!url) {
      if (!confirm('網址留空會關閉這台電腦的雲端同步，確定要儲存嗎？')) return;
      doSave();
      return;
    }
    cloudSetStatus_('正在向這個 API 驗證管理者密碼...', false);
    cloudVerifyAdmin_(url, token, CLOUD_ADMIN_PW, function(ok, err) {
      if (ok) doSave();
      else cloudSetStatus_('❌ 沒有儲存：' + err, true);
    });
  }

  function toggleCloudPanel() {
    var panel = document.getElementById('cloudPanel');
    var show = panel.style.display === 'none';
    panel.style.display = show ? '' : 'none';

      cloudAdminLock_(); // 關閉面板就自動上鎖
    }
  }

  // ---- 管理者解鎖／上鎖 ----
  function cloudVerifyAdmin_(url, token, pw, cb) {
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: token, action: 'verifyAdmin', adminPassword: pw, sid: MY_DEVICE_ID, ip: MY_IP })
    }).then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.ok) cb(true);
        else if (data && /未知的 action/.test(data.error || '')) cb(false, '後端 Code.gs 還是舊版，請先更新並重新部署（新版本）');
        else cb(false, (data && data.error) || '未知錯誤');
      })
      .catch(function() { cb(false, '連不到 API，請確認網址與部署狀態'); });
  }

  function cloudApplyLockUi_() {
    var unlocked = CLOUD_ADMIN_UNLOCKED;
    ['cloudUrlInput', 'cloudTokenInput', 'btnCloudSave', 'btnCloudClear'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.disabled = !unlocked;
    });
    var bar = document.getElementById('cloudLockBar');
    if (bar) bar.classList.toggle('unlocked', unlocked);
    var txt = document.getElementById('cloudLockText');
    if (txt) txt.textContent = unlocked ? '🔓 管理者已解鎖，可以修改設定（10 分鐘或關閉面板後自動上鎖）' : '🔒 僅限管理者修改，一般使用者只能查看目前狀態';
    var btn = document.getElementById('btnCloudUnlock');
    if (btn) btn.textContent = unlocked ? '🔒 重新上鎖' : '🔑 管理者解鎖';
  }

  function cloudAdminTouch_() {
    if (CLOUD_ADMIN_TIMER) clearTimeout(CLOUD_ADMIN_TIMER);
    CLOUD_ADMIN_TIMER = setTimeout(cloudAdminLock_, CLOUD_ADMIN_TIMEOUT_MS);
  }

  function cloudAdminLock_() {
    var wasUnlocked = CLOUD_ADMIN_UNLOCKED;
    CLOUD_ADMIN_UNLOCKED = false;
    CLOUD_ADMIN_PW = '';
    if (CLOUD_ADMIN_TIMER) { clearTimeout(CLOUD_ADMIN_TIMER); CLOUD_ADMIN_TIMER = null; }
    // 沒存的修改一律還原成目前生效的設定
    var urlInput = document.getElementById('cloudUrlInput');
    var tokenInput = document.getElementById('cloudTokenInput');
    if (urlInput) urlInput.value = CLOUD_API_URL;
    if (tokenInput) tokenInput.value = CLOUD_API_TOKEN;
    cloudApplyLockUi_();
    if (wasUnlocked) updateCloudStatus();
  }

  function cloudAdminUnlocked_(pw) {
    CLOUD_ADMIN_PW = pw;
    CLOUD_ADMIN_UNLOCKED = true;
    cloudApplyLockUi_();
    cloudAdminTouch_();
  }

  function cloudAdminUnlock() {
    if (CLOUD_ADMIN_UNLOCKED) { cloudAdminLock_(); return; }
    var pw = prompt('請輸入管理者密碼：');
    if (!pw) return;
    if (!CLOUD_API_URL) {
      // 這台電腦還沒設定過 API：先開放填寫，按「儲存設定」時會到填入的網址驗證管理者密碼，密碼不對就存不進去
      cloudAdminUnlocked_(pw);
      cloudSetStatus_('這台電腦尚未設定 API。請填入網址與驗證碼後按「儲存設定」，儲存時會向該 API 驗證管理者密碼。', false);
      return;
    }
    cloudSetStatus_('驗證管理者密碼中...', false);
    cloudVerifyAdmin_(CLOUD_API_URL, CLOUD_API_TOKEN, pw, function(ok, err) {
      if (ok) {
        cloudAdminUnlocked_(pw);
        updateCloudStatus();
      } else {
        cloudSetStatus_('❌ 解鎖失敗：' + err, true);
      }
    });
  }

  // ============ 線上人數（每 30 秒回報一次，同一台電腦多分頁只算一人） ============
  var DEVICE_ID_KEY = 'lottery_device_id';
  var ONLINE = { count: 0, users: [] };
  var ONLINE_ENV = { os: '', browser: '' };
  var MY_DEVICE_ID = (function() {
    try {
      var id = localStorage.getItem(DEVICE_ID_KEY);
      if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(DEVICE_ID_KEY, id); }
      return id;
    } catch (e) { return Math.random().toString(36).slice(2); }
  })();

  function detectOnlineEnv_() {
    var ua = navigator.userAgent;
    var finish = function() {
      if (!ONLINE_ENV.os) {
        ONLINE_ENV.os = /Windows NT 10/.test(ua) ? 'Windows 10/11' : /Windows/.test(ua) ? 'Windows' : /iPhone|iPad/.test(ua) ? 'iOS ' + ((ua.match(/OS (\d+)_/) || [])[1] || '')
          : /Android/.test(ua) ? 'Android ' + ((ua.match(/Android (\d+)/) || [])[1] || '') : /Mac OS X/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '';
      }
      if (!ONLINE_ENV.browser) {
        var m = ua.match(/Edg\/(\d+)/) ? ['Edge', ua.match(/Edg\/(\d+)/)[1]] : ua.match(/Firefox\/(\d+)/) ? ['Firefox', ua.match(/Firefox\/(\d+)/)[1]]
          : ua.match(/Chrome\/(\d+)/) ? ['Chrome', ua.match(/Chrome\/(\d+)/)[1]] : ua.match(/Version\/(\d+).*Safari/) ? ['Safari', ua.match(/Version\/(\d+)/)[1]] : null;
        if (m) ONLINE_ENV.browser = m.join(' ');
      }
    };
    try {
      var d = navigator.userAgentData;
      if (d && d.getHighEntropyValues) {
        return d.getHighEntropyValues(['platformVersion', 'fullVersionList']).then(function(h) {
          var pv = parseInt((h.platformVersion || '0').split('.')[0], 10) || 0;
          if (d.platform === 'Windows') ONLINE_ENV.os = pv >= 13 ? 'Windows 11' : pv > 0 ? 'Windows 10' : 'Windows';
          else if (d.platform === 'macOS') ONLINE_ENV.os = 'macOS ' + (h.platformVersion || '').split('.').slice(0, 2).join('.');
          else if (d.platform === 'Android') ONLINE_ENV.os = 'Android ' + (h.platformVersion || '').split('.')[0];
          else ONLINE_ENV.os = d.platform || '';
          var list = (h.fullVersionList || d.brands || []).filter(function(b) { return !/Not.?A.?Brand|Chromium/i.test(b.brand); });
          var pick = list.filter(function(b) { return /Edge|Opera|Brave|Vivaldi/i.test(b.brand); })[0] || list.filter(function(b) { return /Chrome/i.test(b.brand); })[0] || list[0];
          if (pick) ONLINE_ENV.browser = pick.brand.replace('Google ', '').replace('Microsoft ', '') + ' ' + String(pick.version).split('.')[0];
        })['catch'](function() {}).then(finish);
      }
    } catch (e) {}
    finish();
    return Promise.resolve();
  }

  // ---- 電腦 IP（跟許瑞興訂單管理系統同樣做法：對外 IP 用 api.ipify.org，內網 IP 用 WebRTC 偵測） ----
  var MY_IP = '';
  function getLocalIp_() {
    return new Promise(function(resolve) {
      var RTCPeer = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
      if (!RTCPeer) return resolve('');
      var pc;
      try {
        pc = new RTCPeer({ iceServers: [] });
        pc.createDataChannel('');
        pc.createOffer().then(function(offer) { pc.setLocalDescription(offer); })['catch'](function() {});
      } catch (e) { return resolve(''); }
      var timer = setTimeout(function() { try { pc.close(); } catch (e) {} resolve(''); }, 800);
      pc.onicecandidate = function(ice) {
        if (!ice || !ice.candidate || !ice.candidate.candidate) return;
        var m = ice.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
        if (m && m[1] !== '0.0.0.0' && m[1].indexOf('127.') !== 0) {
          clearTimeout(timer);
          try { pc.close(); } catch (e) {}
          resolve(m[1]);
        }
      };
    });
  }

  function detectIp_() {
    var extP = fetch('https://api.ipify.org?format=json', { cache: 'no-store' })
      .then(function(r) { return r.json(); }).then(function(d) { return (d && d.ip) || ''; })['catch'](function() { return ''; });
    return Promise.all([getLocalIp_(), extP]).then(function(r) {
      var local = r[0] || '', ext = r[1] || '';
      if (ext && local) MY_IP = ext + (/^(10|192|172)\./.test(local) ? ' (內:' + local + ')' : ' (' + local + ')');
      else MY_IP = ext || (local ? '內:' + local : '');
    });
  }

  function escHtml_(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  function onlineAgo_(since, now) {
    var m = Math.floor(((now || Date.now() / 1000) - since) / 60);
    return m < 1 ? '剛連線' : m < 60 ? '已連線 ' + m + ' 分鐘' : '已連線 ' + Math.floor(m / 60) + ' 小時 ' + (m % 60) + ' 分';
  }

  function updateOnlineBadge_() {
    var badge = document.getElementById('onlineBadge');
    var countEl = document.getElementById('onlineCount');
    if (!badge || !countEl) return;
    var on = cloudEnabled_() && ONLINE.ok;
    countEl.textContent = on ? ONLINE.count : '—';
    badge.classList.toggle('off', !on);
    badge.title = on ? '點擊查看目前在線的電腦' : '這台電腦尚未設定雲端同步（或連不到 API），無法統計線上人數';
  }

  function renderOnlineList_() {
    var el = document.getElementById('onlineList');
    if (!el) return;
    if (!cloudEnabled_()) { el.innerHTML = '這台電腦尚未設定雲端同步，無法統計線上人數（請洽管理者設定「雲端同步設定」）。'; return; }
    if (!ONLINE.ok) { el.innerHTML = '目前連不到雲端 API，暫時無法取得線上人數。'; return; }
    if (!ONLINE.users.length) { el.innerHTML = '目前沒有其他人在線'; return; }
    el.innerHTML = '<table><thead><tr><th>#</th><th>電腦 IP</th><th>電腦</th><th>作業系統</th><th>瀏覽器</th><th>裝置 ID</th><th>連線時間</th></tr></thead><tbody>' +
      ONLINE.users.map(function(u, i) {
        var me = u.device === MY_DEVICE_ID;
        return '<tr' + (me ? ' class="me"' : '') + '><td>' + (i + 1) + '</td><td class="mono">' + escHtml_(u.ip || '未取得') + '</td><td>' + (me ? '本機' : '電腦 ' + (i + 1)) + '</td><td>' + escHtml_(u.os || '—') + '</td><td>' + escHtml_(u.browser || '—') +
          '</td><td class="mono">' + escHtml_(u.device) + '</td><td>' + onlineAgo_(u.since, ONLINE.now) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<div class="ol-note">每 30 秒更新一次；同一台電腦開多個分頁只算一人；超過 75 秒沒回應視為離線。</div>';
  }

  function toggleOnlineList() {
    var el = document.getElementById('onlineList');
    var show = el.style.display === 'none';
    el.style.display = show ? '' : 'none';
    document.getElementById('onlineArrow').textContent = show ? '▴' : '▾';
    if (show) { renderOnlineList_(); pingPresence(); }
  }

  function pingPresence() {
    if (!cloudEnabled_()) { ONLINE = { ok: false, count: 0, users: [] }; updateOnlineBadge_(); return; }
    fetch(CLOUD_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: CLOUD_API_TOKEN, action: 'presence', sid: MY_DEVICE_ID, ip: MY_IP, os: ONLINE_ENV.os, browser: ONLINE_ENV.browser })
    }).then(function(res) { return res.json(); })
      .then(function(data) {
        ONLINE = (data && data.ok) ? { ok: true, count: data.count, users: data.users || [], now: data.now } : { ok: false, count: 0, users: [] };
      })['catch'](function() { ONLINE = { ok: false, count: 0, users: [] }; })
      .then(function() {
        updateOnlineBadge_();
        if (document.getElementById('onlineList').style.display !== 'none') renderOnlineList_();
      });
  }

  function startPresence_() {
    // 先送一次（不等 IP），IP 偵測完成後再補送一次帶 IP 的回報
    detectOnlineEnv_().then(pingPresence);
    detectIp_().then(pingPresence);
    setInterval(pingPresence, 30000);
    document.addEventListener('visibilitychange', function() { if (!document.hidden) pingPresence(); });
    window.addEventListener('pagehide', function() {
      if (!cloudEnabled_() || !navigator.sendBeacon) return;
      try {
        navigator.sendBeacon(CLOUD_API_URL, JSON.stringify({ token: CLOUD_API_TOKEN, action: 'presence', sid: MY_DEVICE_ID, leave: true }));
      } catch (e) {}
    });
  }

  function cloudSetStatus_(text, isError) {
    var statusEl = document.getElementById('cloudStatus');
    if (!statusEl) return;
    statusEl.textContent = text;
    statusEl.classList.toggle('cloud-status-error', !!isError);
  }

  function updateCloudStatus() {
    if (!CLOUD_API_URL) {
      cloudSetStatus_('尚未設定雲端同步，抽籤結果只會留在這台電腦的瀏覽器裡。', false);
    } else if (CLOUD_SESSION_ID) {
      cloudSetStatus_('已設定雲端同步，目前這場抽籤已同步到試算表（場次編號：' + CLOUD_SESSION_ID + '）。', false);
    } else {
      cloudSetStatus_('已設定雲端同步，按下第一次「抽籤」會自動建立新場次。', false);
    }
  }

  function cloudEnabled_() { return !!CLOUD_API_URL; }

  // 統一處理雲端 API 回應：連線失敗、驗證碼錯誤、部署設定錯誤等都會直接顯示在畫面上，
  // 不會只寫進瀏覽器 console（一般使用者不會去看 console，之前這樣會讓人以為「同步了」但其實沒有）
  function cloudPost_(payload, onOk) {
    if (!cloudEnabled_()) return;
    payload.token = CLOUD_API_TOKEN;
    fetch(CLOUD_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 用 text/plain 避免瀏覽器送出 CORS 預檢請求
      body: JSON.stringify(payload)
    }).then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.ok) {
          if (onOk) onOk(data);
          else updateCloudStatus();
        } else {
          cloudSetStatus_('⚠️ 雲端同步失敗（' + (data && data.error ? data.error : '未知錯誤') + '），這次抽籤只留在本機瀏覽器', true);
        }
      })
      .catch(function(e) {
        cloudSetStatus_('⚠️ 雲端同步失敗（連不到 API，網址可能填錯或還沒部署），這次抽籤只留在本機瀏覽器', true);
        console.warn('雲端同步失敗：', e);
      });
  }

  function cloudCreateSession_() {
    if (!cloudEnabled_()) return;
    CLOUD_SESSION_ID = null;
    var excludedList = Object.keys(excluded).map(function(k) { return parseInt(k, 10); });
    var groupSel = document.getElementById('groupMode');
    cloudPost_({
      action: 'createSession',
      rows: rows, cols: cols,
      excludedCells: excludedList,
      groupMode: groupSel ? groupSel.value : 'none',
      note: ''
    }, function(data) {
      CLOUD_SESSION_ID = data.sessionId;
      updateCloudStatus();
      saveStateToStorage();
    });
  }

  function cloudAddDraw_(seq, num, r, c) {
    if (!cloudEnabled_() || !CLOUD_SESSION_ID) return;
    cloudPost_({ action: 'addDraw', sessionId: CLOUD_SESSION_ID, seq: seq, num: num, row: r, col: c });
  }

  function cloudUndoLastDraw_() {
    if (!cloudEnabled_() || !CLOUD_SESSION_ID) return;
    cloudPost_({ action: 'undoLastDraw', sessionId: CLOUD_SESSION_ID });
  }

  function cloudCompleteSession_() {
    if (!cloudEnabled_() || !CLOUD_SESSION_ID) return;
    cloudPost_({ action: 'completeSession', sessionId: CLOUD_SESSION_ID });
  }

  // 手動測試按鈕：檢查 API 網址是否真的可以連通（呼叫 doGet?action=ping）
  function cloudTestConnection() {
    var url = (document.getElementById('cloudUrlInput').value || '').trim();
    if (!url) { alert('請先填入 GAS API 網址'); return; }
    cloudSetStatus_('測試連線中...', false);
    fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'action=ping')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.ok) {
          cloudSetStatus_('✅ 連線成功！API 正常運作（時間：' + data.time + '）。記得再按左邊的「儲存設定」。', false);
        } else {
          cloudSetStatus_('⚠️ 連線得到回應，但內容不是預期的格式，請確認網址是否正確。', true);
        }
      })
      .catch(function(e) {
        cloudSetStatus_('❌ 連不到這個網址。請確認：1) 網址有貼對且結尾是 /exec；2) GAS 已經「部署」為網頁應用程式；3) 部署權限選「任何人」。', true);
        console.warn('測試連線失敗：', e);
      });
  }

  // 一鍵清除雲端試算表（Sessions／Draws 兩表全部清空，只留標題列）：高風險操作，要求連續兩次確認，
  // 第二次還要求手動輸入固定文字，降低手滑誤觸的機會；成功或失敗都要在畫面上講清楚。
  function cloudClearAll() {
    if (!CLOUD_ADMIN_UNLOCKED) { alert('只有管理者可以清除雲端試算表，請先按「🔑 管理者解鎖」。'); return; }
    if (!cloudEnabled_()) { alert('請先設定並儲存 GAS API 網址，才能清除雲端試算表。'); return; }
    cloudAdminTouch_();
    if (!confirm('⚠️ 確定要清除雲端試算表的「全部」資料嗎？\n\n這會把 Sessions（場次）與 Draws（抽籤紀錄）兩個表格全部清空，所有歷史場次都會消失，且無法復原。\n\n只會清除雲端資料，不會影響這台電腦目前畫面上的格子。')) return;
    var typed = prompt('請再輸入「清除」兩個字以確認執行（避免手滑誤觸）：');
    if (typed !== '清除') { alert('輸入內容不符，已取消清除。'); return; }
    cloudSetStatus_('清除中，請稍候...', false);
    fetch(CLOUD_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: CLOUD_API_TOKEN, action: 'clearAll', confirm: 'CLEAR_ALL', adminPassword: CLOUD_ADMIN_PW, sid: MY_DEVICE_ID, ip: MY_IP })
    }).then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.ok) {
          CLOUD_SESSION_ID = null;
          cloudSetStatus_('✅ 已清除雲端試算表（Sessions 清掉 ' + data.clearedSessions + ' 筆、Draws 清掉 ' + data.clearedDraws + ' 筆）。', false);
        } else {
          cloudSetStatus_('❌ 清除失敗（' + (data && data.error ? data.error : '未知錯誤') + '）。', true);
        }
      })
      .catch(function(e) {
        cloudSetStatus_('❌ 連不到這個網址，清除失敗，請確認 API 網址與部署狀態。', true);
        console.warn('清除雲端試算表失敗：', e);
      });
  }

  // ============ 列印 / 匯出座位表 ============
  function printSeatChart() {
    var titleEl = document.getElementById('printTitle');
    var now = new Date();
    titleEl.textContent = '電腦挑人抽籤系統 － ' + (seatMode === 'table' ? '桌次結果' : '座位結果') + '（' + now.getFullYear() + '/' + pad(now.getMonth()+1) + '/' + pad(now.getDate()) + '）';

    var groupBox = document.getElementById('printGroupResults');
    var breakdown = getResultBreakdown_();
    if (breakdown.items.length === 0) {
      groupBox.innerHTML = '';
    } else if (breakdown.type === 'group') {
      groupBox.innerHTML = '<div class="print-group-title">分組結果</div>' + breakdown.items.map(function(g) {
        return '<div class="print-group-row"><b>第 ' + (g.gi + 1) + ' 組（' + g.nums.length + ' 人）</b>' + g.nums.join('、') + '</div>';
      }).join('');
    } else {
      groupBox.innerHTML = '<div class="print-group-title">抽籤順序</div>' + breakdown.items.map(function(h) {
        return '<div class="print-group-row"><b>第 ' + h.seq + ' 個抽到</b>' + h.num + '　→　' + posLabel_(h.r, h.c) + '</div>';
      }).join('');
    }

    window.print();
  }

  // ============ 匯出抽籤紀錄 CSV ============
  function exportHistoryCsv() {
    if (drawHistory.length === 0) { alert('目前沒有可匯出的抽籤紀錄'); return; }
    var sel = document.getElementById('groupMode');
    var mode = sel ? sel.value : 'none';
    var hasGroup = mode !== 'none';
    var u = unitNames_();
    var lines = [hasGroup ? ('次序,號碼,' + u.row + ',' + u.col + ',組別') : ('次序,號碼,' + u.row + ',' + u.col)];
    drawHistory.forEach(function(h) {
      var row = h.seq + ',' + h.num + ',' + h.r + ',' + h.c;
      if (hasGroup) {
        var gi = groupIndexForCell(h.cellIdx, h.num);
        row += ',' + (gi !== null ? ('第' + (gi + 1) + '組') : '');
      }
      lines.push(row);
    });
    if (hasGroup) {
      var groupResults = collectGroupResults_();
      if (groupResults.length > 0) {
        lines.push('');
        lines.push('分組結果');
        groupResults.forEach(function(g) {
          lines.push('第' + (g.gi + 1) + '組（' + g.nums.length + '人）,' + g.nums.join('、'));
        });
      }
    }
    // 沒開分組時，上面「次序」欄位本身就已經是依抽到的順序排列，不用再重複附一份順序清單
    var csvContent = '﻿' + lines.join('\r\n');
    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var now = new Date();
    var stamp = now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes());
    a.href = url;
    a.download = '抽籤紀錄_' + stamp + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // ============ 匯出座位圖片（Canvas，不需外部函式庫） ============
  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function exportGridAsPng() {
    if (total === 0) { alert('請先建立格子'); return; }
    var cellSize = 70, gap = 8, boxPad = 20, titleH = 46;
    var breakdown = getResultBreakdown_();
    var legendItems = breakdown.items;
    var legendH = legendItems.length > 0 ? (44 + legendItems.length * 24 + 16) : 0;
    var canvasW = cols * cellSize + (cols - 1) * gap + boxPad * 2;
    var canvasH = rows * cellSize + (rows - 1) * gap + boxPad * 2 + titleH + legendH;
    // 匯出解析度倍率：畫布本身還是照 canvasW/canvasH 的「邏輯尺寸」畫圖（下面座標都不用改），
    // 但實際輸出的圖片像素放大 EXPORT_SCALE 倍，這樣圖片才不會太小、列印或放大看也不會糊；
    // 格子數很多、清單又很長時，自動降倍避免超過瀏覽器畫布尺寸上限
    var EXPORT_SCALE = 3;
    var CANVAS_AREA_LIMIT = 200000000;
    while (EXPORT_SCALE > 1 && (canvasW * EXPORT_SCALE) * (canvasH * EXPORT_SCALE) > CANVAS_AREA_LIMIT) {
      EXPORT_SCALE--;
    }
    var canvas = document.createElement('canvas');
    canvas.width = canvasW * EXPORT_SCALE;
    canvas.height = canvasH * EXPORT_SCALE;
    var ctx = canvas.getContext('2d');
    ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
    var dark = darkMode;

    ctx.fillStyle = dark ? '#0f172a' : '#ffffff';
    ctx.fillRect(0, 0, canvasW, canvasH);
    ctx.fillStyle = dark ? '#e2e8f0' : '#1e293b';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var now = new Date();
    ctx.fillText('電腦挑人抽籤系統 ' + (seatMode === 'table' ? '桌次結果' : '座位結果') + '（' + now.getFullYear() + '/' + pad(now.getMonth() + 1) + '/' + pad(now.getDate()) + '）', canvasW / 2, 16);

    for (var idx = 0; idx < total; idx++) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var x = boxPad + c * (cellSize + gap);
      var y = boxPad + titleH + r * (cellSize + gap);
      var isExcluded = !!excluded[idx];
      var info = drawnMap[idx];
      var groupColor = info ? groupColorForCell(idx, info.num) : null;

      var fillColor, borderColor, textColor;
      if (isExcluded) {
        fillColor = dark ? '#334155' : '#e2e8f0';
        borderColor = '#94a3b8';
        textColor = '#94a3b8';
      } else if (info) {
        fillColor = groupColor ? hexToRgba(groupColor, 0.22) : (dark ? '#1e3a8a' : '#eff6ff');
        borderColor = groupColor || (dark ? '#3b82f6' : '#2563eb');
        textColor = groupColor || (dark ? '#60a5fa' : '#1d4ed8');
      } else {
        fillColor = dark ? '#1e293b' : '#f8fafc';
        borderColor = dark ? '#334155' : '#cbd5e1';
        textColor = dark ? '#94a3b8' : '#64748b';
      }

      roundRectPath(ctx, x, y, cellSize, cellSize, 10);
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (isExcluded) {
        ctx.font = '24px sans-serif';
        ctx.fillStyle = textColor;
        ctx.fillText('🚫', x + cellSize / 2, y + cellSize / 2);
      } else if (info) {
        ctx.font = 'bold 22px sans-serif';
        ctx.fillStyle = textColor;
        ctx.fillText(String(info.num), x + cellSize / 2, y + cellSize / 2 - 4);
      }

      ctx.font = '10px sans-serif';
      ctx.fillStyle = dark ? '#94a3b8' : '#64748b';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';
      ctx.fillText((r + 1) + '-' + (c + 1), x + cellSize - 4, y + cellSize - 3);
    }

    if (legendItems.length > 0) {
      var legendTop = boxPad + titleH + rows * cellSize + (rows - 1) * gap + 20;
      ctx.strokeStyle = dark ? '#334155' : '#cbd5e1';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(boxPad, legendTop - 8);
      ctx.lineTo(canvasW - boxPad, legendTop - 8);
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = dark ? '#e2e8f0' : '#1e293b';
      ctx.fillText(breakdown.type === 'group' ? '分組結果' : '抽籤順序', boxPad, legendTop);
      var legendY = legendTop + 28;

      if (breakdown.type === 'group') {
        legendItems.forEach(function(g) {
          ctx.fillStyle = g.color;
          roundRectPath(ctx, boxPad, legendY, 14, 14, 3);
          ctx.fill();

          ctx.font = 'bold 13px sans-serif';
          ctx.fillStyle = dark ? '#e2e8f0' : '#1e293b';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText('第 ' + (g.gi + 1) + ' 組（' + g.nums.length + ' 人）：', boxPad + 22, legendY - 1);

          ctx.font = '13px sans-serif';
          ctx.fillStyle = dark ? '#94a3b8' : '#64748b';
          ctx.fillText(g.nums.join('、'), boxPad + 150, legendY - 1);

          legendY += 24;
        });
      } else {
        legendItems.forEach(function(h) {
          ctx.font = 'bold 13px sans-serif';
          ctx.fillStyle = dark ? '#e2e8f0' : '#1e293b';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText('第 ' + h.seq + ' 個抽到：', boxPad, legendY - 1);

          ctx.font = '13px sans-serif';
          ctx.fillStyle = dark ? '#94a3b8' : '#64748b';
          ctx.fillText(h.num + '　→　' + posLabel_(h.r, h.c), boxPad + 100, legendY - 1);

          legendY += 24;
        });
      }
    }

    canvas.toBlob(function(blob) {
      if (!blob) { alert('圖片產生失敗，請改用「列印/匯出座位表」試試。'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes());
      a.href = url;
      a.download = '座位表_' + stamp + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    });
  }

  // ============ 本機儲存：自動記住進度 ============
  function saveStateToStorage() {
    try {
      var groupSel = document.getElementById('groupMode');
      var drawLimitEl = document.getElementById('drawLimitInput');
      var state = {
        rows: rows, cols: cols, total: total,
        excluded: excluded, started: started,
        pool: pool, cellOrder: cellOrder, activeCellOrder: activeCellOrder,
        filledCount: filledCount, drawHistory: drawHistory,
        groupMode: groupSel ? groupSel.value : 'none',
        drawLimit: drawLimitEl ? drawLimitEl.value : '',
        randomGroupMaps: randomGroupMaps,
        seatMode: seatMode,
        cloudSessionId: CLOUD_SESSION_ID,
        cellsHtml: cellRefs.map(function(el){ return el.innerHTML; }),
        cellsClass: cellRefs.map(function(el){ return el.className; }),
        cellsStyle: cellRefs.map(function(el){ return el.style.cssText; })
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function loadStateFromStorage() {
    var raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return; }
    if (!raw) return;
    var state;
    try { state = JSON.parse(raw); } catch (e) { return; }
    if (!state || !state.total) return;

    var restoreModeIsTable = state.seatMode === 'table';
    var confirmSummary = restoreModeIsTable
      ? (state.rows + ' 桌 × 每桌 ' + state.cols + ' 人，已抽 ' + state.filledCount + ' 人')
      : (state.rows + ' 行 × ' + state.cols + ' 列，已抽 ' + state.filledCount + ' 格');
    var keep = confirm(
      '偵測到上次未完成的抽籤紀錄（' + confirmSummary + '）。\n' +
      '要繼續上次的進度嗎？\n（選擇「取消」會清除紀錄、從空白開始）'
    );
    if (!keep) {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      return;
    }

    seatMode = state.seatMode || 'grid';
    var seatModeSel = document.getElementById('seatModeSelect');
    if (seatModeSel) seatModeSel.value = seatMode;
    applySeatModeLabels_();

    rows = state.rows; cols = state.cols; total = state.total;
    excluded = state.excluded || {};
    started = !!state.started;
    pool = state.pool || [];
    cellOrder = state.cellOrder || [];
    activeCellOrder = state.activeCellOrder || [];
    filledCount = state.filledCount || 0;
    drawHistory = state.drawHistory || [];
    drawnMap = {};
    drawHistory.forEach(function(h) { drawnMap[h.cellIdx] = { num: h.num, r: h.r, c: h.c }; });
    randomGroupMaps = state.randomGroupMaps || {};
    CLOUD_SESSION_ID = state.cloudSessionId || null;
    updateCloudStatus();

    document.getElementById('rowsInput').value = rows;
    document.getElementById('colsInput').value = cols;

    var drawLimitEl = document.getElementById('drawLimitInput');
    if (drawLimitEl) drawLimitEl.value = state.drawLimit || '';

    var groupSel = document.getElementById('groupMode');
    if (groupSel) groupSel.value = state.groupMode || 'none';

    renderEmptyGrid();
    (state.cellsHtml || []).forEach(function(html, idx) { if (cellRefs[idx]) cellRefs[idx].innerHTML = html; });
    (state.cellsClass || []).forEach(function(cls, idx) { if (cellRefs[idx]) cellRefs[idx].className = cls; });
    (state.cellsStyle || []).forEach(function(css, idx) { if (cellRefs[idx]) cellRefs[idx].style.cssText = css || ''; });

    updateTotalHint();
    updateProgress();
    renderHistory();

    document.getElementById('btnReset').disabled = false;
    document.getElementById('btnHistory').disabled = false;
    document.getElementById('btnUndo').disabled = drawHistory.length === 0;

    var doneAlready = started && filledCount >= activeCellOrder.length && activeCellOrder.length > 0;
    document.getElementById('btnDraw').disabled = doneAlready;
    document.getElementById('btnDrawAll').disabled = doneAlready;

    if (started) {
      lockExcludeEditing();
    } else {
      document.getElementById('btnExclude').disabled = false;
    }

    if (drawHistory.length > 0) {
      var last = drawHistory[drawHistory.length - 1];
      showResult(last.num, last.r, last.c);
    } else {
      clearResultDisplay();
    }

    if (doneAlready) {
      var done = document.createElement('div');
      done.className = 'done-msg';
      done.textContent = '🎉 已抽完全部 ' + activeCellOrder.length + ' 格！';
      document.getElementById('resultBox').appendChild(done);
    }

    applyGroupColors();
  }

  // ============ 鍵盤快捷鍵：空白鍵＝抽籤 ============
  document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.key === ' ') {
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      var btn = document.getElementById('btnDraw');
      if (btn && !btn.disabled) drawNumber();
    }
    if ((e.code === 'Escape' || e.key === 'Escape') && bigScreen) {
      toggleBigScreen();
    }
  });

  function toggleChangelog() {
    var panel = document.getElementById('changelogPanel');
    var show = panel.style.display === 'none';
    panel.style.display = show ? '' : 'none';
    if (show) renderChangelog();
  }

  function renderChangelog() {
    var listEl = document.getElementById('changelogList');
    if (!listEl) return;
    listEl.innerHTML = CHANGELOG.map(function(item) {
      var notesHtml = item.notes.map(function(n) { return '<li>' + n + '</li>'; }).join('');
      return '<div class="changelog-entry">' +
        '<div class="changelog-head">' + item.v + '<span class="changelog-date">' + item.date + '</span></div>' +
        '<ul>' + notesHtml + '</ul>' +
        '</div>';
    }).join('');
  }

  document.getElementById('versionTag').textContent = APP_VERSION;

  applySeatModeLabels_();
  loadDarkModePref();
  loadCloudSettings();
  cloudApplyLockUi_();
  startPresence_();
  loadStateFromStorage();
</script>
